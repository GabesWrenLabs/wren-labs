; Wren Tank Alert: range-test firmware (unknown #2 in ../SPEC.md).
; One image for both Heltec WiFi LoRa 32 V3 boards (ESP32-S3 + SX1262 + 0.96" OLED).
; Role is picked at power-up by the PRG/BOOT button: held = HOUSE, not held = TRUCK.
;
; Build:   pio run
; Flash:   pio run -t upload --upload-port COMx      (or the merged .bin, see release/RANGE_TEST.md)
; Monitor: pio device monitor -b 115200

[platformio]
default_envs = heltec_v3
src_dir = src

[env:heltec_v3]
platform = espressif32
framework = arduino
board = heltec_wifi_lora_32_V3
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D WREN_RANGE_VERSION=\"v0.1\"
lib_deps =
  jgromes/RadioLib @ ^7.1.0
  olikraus/U8g2 @ ^2.35.0
