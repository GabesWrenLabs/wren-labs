; Wren Tally firmware. Two targets, one repo.
;   light : the wireless tally/cue light (ESP-NOW receiver + 6 RGB LEDs)
;   base  : the base station (switcher client -> ESP-NOW broadcaster)
; Dev-board stage: both run on plain ESP32-C3 dev boards (ESP32-C3-DevKitM-1 or the
; cheap "ESP32-C3 SuperMini"). Pins are in common/wren_pins.h.
;
; Build:  pio run -e light      pio run -e base
; Flash:  pio run -e light -t upload --upload-port COMx
; Monitor: pio device monitor -b 115200

[platformio]
default_envs = light, base
src_dir = .

[env]
platform = espressif32
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D WREN_PROTO_VERSION=1
  -I common

[env:light]
build_src_filter = +<light/> +<common/>
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.0

[env:base]
build_src_filter = +<base/> +<common/>
lib_deps =
  gilmaimon/ArduinoWebsockets @ ^0.5.4
  bblanchon/ArduinoJson @ ^7.0.0
